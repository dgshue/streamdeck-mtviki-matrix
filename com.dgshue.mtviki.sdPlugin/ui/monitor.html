<!DOCTYPE html>
<html>
	<head>
		<meta charset="utf-8" />
		<script src="sdpi-components.js"></script>
	</head>
	<body>
		<sdpi-item label="Monitor">
			<sdpi-select
				setting="match"
				datasource="getMonitors"
				loading="Detecting monitors..."
				showRefresh
			></sdpi-select>
		</sdpi-item>

		<sdpi-item label="Input">
			<sdpi-select
				setting="value"
				datasource="getInputs"
				loading="Reading inputs..."
				showRefresh
			></sdpi-select>
		</sdpi-item>

		<p class="sdpi-info">
			Switches the monitor's own input over DDC/CI. Both lists are read from the
			monitor, so only inputs it actually accepts are offered. Switching onto an
			input fed by the matrix is <b>one-way</b> &mdash; the matrix blocks DDC, so
			only the monitor's OSD brings it back.
		</p>
	</body>
</html>
